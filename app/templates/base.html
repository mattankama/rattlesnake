<!DOCTYPE html>
{# data-base: the path the app is served under ("" in dev, "/rattlesnake" on GitHub
   Pages), for app.js to build page URLs from. url_for already includes it. #}
<html lang="en" data-base="{{ request.script_root }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0F0E0D">
    <meta name="description" content="Rattlesnake — weightlifting workout tracker">

    <title>{% block title %}Rattlesnake{% endblock %}</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='icons/favicon.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Rattlesnake">

    <!-- One variable family, two axes (weight 100-900, width 62-125%).
         Width carries hierarchy, so there is nothing else to load. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin
          href="{{ url_for('static', filename='fonts/archivo-latin-var.woff2') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <!-- Ambient heat: one soft field behind everything, so the canvas reads as
         a lit space rather than a flat black sheet. -->
    <div class="aura" aria-hidden="true"></div>

    {% block content %}{% endblock %}

    <!-- The data layer, in dependency order: the store, the API that reads and
         writes it, and the IndexedDB mirror that outlives the tab. app.js wires
         them together and every screen script below depends on that. -->
    <script src="{{ url_for('static', filename='js/store.js') }}"></script>
    <script src="{{ url_for('static', filename='js/local-api.js') }}"></script>
    <script src="{{ url_for('static', filename='js/persist.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}

    <script>
        // Skipped on localhost: a service worker needs a secure context, so the
        // phone hitting the dev server over LAN http never reaches this anyway,
        // but localhost *is* secure — and a cache-first worker there would serve
        // stale files straight past Flask's reloader.
        if ("serviceWorker" in navigator &&
            !["localhost", "127.0.0.1"].includes(location.hostname)) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("{{ url_for('views.service_worker') }}").catch((err) => {
                    console.warn("[rattlesnake] service worker did not register", err);
                });
            });
        }
    </script>
</body>
</html>
