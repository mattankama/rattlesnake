{# Home pane. Markup only — the pager shell owns the scroll container. #}
<div class="home-container">
    <header class="home-header">
        <h1 class="home-title">Rattlesnake</h1>
    </header>

    <!-- Filled by home.js only on the load that auto-saved a workout. -->
    <div id="autosave-note" class="home-note" role="status" hidden></div>

    <div id="routines-list" class="routines-list">
        <!-- Populated by JS -->
    </div>

    <div id="empty-state" class="empty-state" style="display: none;">
        <p class="empty-state-title">No routines yet</p>
        <p class="empty-state-hint">Create one to start tracking your lifts.</p>
    </div>

    <!-- A full-width pill at the foot of the pane: no glass, no divider, and
         nothing pinned, so no card ever scrolls underneath it. -->
    <div class="home-actions">
        <a href="{{ url_for('views.routine') }}" class="btn btn-secondary" id="create-routine-btn">Create Routine</a>
    </div>
</div>
