{% extends "base.html" %}
{% block title %}Routine — Rattlesnake{% endblock %}

{% block content %}
<div class="routine-container">
    <header class="routine-header">
        <a href="{{ url_for('views.home') }}" class="back-link">← Back</a>
        <h1 class="page-title" id="page-title">New Routine</h1>
    </header>

    <form id="routine-form" class="routine-form">
        <div class="form-group">
            <label for="routine-name" class="field-label">Routine Name</label>
            <input type="text" id="routine-name" class="form-input" placeholder="e.g. Push Day" required>
        </div>

        <div class="form-group">
            <span class="field-label">Exercises</span>
            <div id="exercise-list" class="exercise-list">
                <!-- Populated by JS -->
            </div>
            <button type="button" id="add-exercise-btn" class="btn btn-secondary">Add Exercise</button>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-accent" id="save-routine-btn">Save Routine</button>
            <a href="{{ url_for('views.home') }}" class="btn btn-muted">Cancel</a>
        </div>
    </form>

    <section class="danger-zone" id="danger-zone">
        <button type="button" class="btn btn-danger" id="delete-routine-btn">Delete Routine</button>
        <div class="confirm-box" id="delete-confirm" style="display: none;">
            <p class="confirm-message" id="delete-confirm-message">
                Delete this routine? This can't be undone.
            </p>
            <div class="confirm-actions">
                <button type="button" class="btn btn-muted" id="delete-cancel-btn">Cancel</button>
                <button type="button" class="btn btn-danger" id="delete-confirm-btn">Delete</button>
            </div>
        </div>
    </section>
</div>

<script>
    // `/routine/` is the new-routine form and `/routine/?id=12` edits an
    // existing one. Reading the id here rather than rendering two different
    // pages is what lets one file on a static host serve both.
    (function () {
        const id = new URLSearchParams(location.search).get("id");
        window.ROUTINE_ID = id && /^\d+$/.test(id) ? Number(id) : null;

        if (window.ROUTINE_ID) {
            document.title = "Edit Routine — Rattlesnake";
            document.getElementById("page-title").textContent = "Edit Routine";
        } else {
            // There is nothing to delete yet. Removing the section rather than
            // hiding it keeps routine.js's "is there a delete button?" check
            // answering the same question it always has.
            document.getElementById("danger-zone").remove();
        }
    })();
</script>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/reorder.js') }}"></script>
<script src="{{ url_for('static', filename='js/routine.js') }}"></script>
{% endblock %}
